name: Android Release Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow only one release build per branch at a time.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed to publish a GitHub Release with the APK

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret set — falling back to debug-signed release."
          fi

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -e
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "No APK produced." >&2
            exit 1
          fi
          renamed="agentic-${GITHUB_SHA:0:7}.apk"
          cp "$apk" "$renamed"
          echo "apk_path=$renamed" >> "$GITHUB_OUTPUT"
          ls -lh "$renamed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
